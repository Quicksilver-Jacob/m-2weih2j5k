<!doctype html>

<title>CSCA 数学练习261023</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f8fafc; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 16px/1.7 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
  header.paper { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 24px; }
  h1 { font-size: 22px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .meta { display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:14px; }
  .meta b { color:var(--ink); }
  .bar { position:sticky; top:0; z-index:20; display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:rgba(248,250,252,.95); backdrop-filter:blur(6px); padding:12px 0; border-bottom:1px solid var(--line); margin:16px 0 8px; }
  .timer { font-variant-numeric: tabular-nums; font-weight:700; font-size:18px; margin-right:auto; }
  .timer.warn { color:#b91c1c; }
  button { font: inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 12px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost { background:transparent; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .student { display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; }
  .student input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; min-width:180px; }
  .q { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:14px 0; }
  .q h3 { margin:0 0 10px; font-size:16px; font-weight:600; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:10px; cursor:pointer; }
  .opt:hover { background:#f1f5f9; }
  .opt.on { background:#eff6ff; outline:1px solid #bfdbfe; }
  .opt .k { font-weight:700; width:22px; flex:none; }
  .foot { color:var(--muted); font-size:13px; margin-top:26px; }
  .gate { position:fixed; inset:0; background:#fff; z-index:50; display:flex; align-items:center; justify-content:center; }
  .gate .box { width:min(92vw,360px); border:1px solid var(--line); border-radius:14px; padding:22px; text-align:center; }
  .gate input { width:100%; padding:10px; margin:12px 0; border:1px solid var(--line); border-radius:9px; font:inherit; }
  .err { color:#b91c1c; font-size:14px; min-height:20px; }
  .done { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:12px; padding:14px 16px; margin:16px 0; display:none; }
  .result { display:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:16px 0; }
  .result.show { display:block; }
  .result h2 { margin:0 0 6px; font-size:18px; }
  .result-score { font-size:30px; font-weight:800; line-height:1.2; }
  .result-score small { font-size:15px; font-weight:600; color:var(--muted); }
  .result-meta { color:var(--muted); font-size:14px; margin-top:4px; }
  .result-hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .opt.correct { background:#ecfdf5; outline:1px solid #86efac; }
  .opt.wrong { background:#fef2f2; outline:1px solid #fca5a5; }
  .badge { margin-left:auto; flex:none; border:1px solid currentColor; border-radius:6px; padding:0 6px; font-size:11px; line-height:18px; }
  .badge.ok { color:#047857; }
  .badge.bad { color:#b91c1c; }
  .explain { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; font-size:14px; color:#374151; }
  .explain summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .q.ok { border-left:4px solid #34d399; }
  .q.bad { border-left:4px solid #f87171; }
  /* floating progress panel */
  .panel { position:fixed; right:16px; bottom:16px; z-index:30; width:216px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 28px rgba(15,23,42,.14); font-size:13px; }
  .panel-head { display:flex; align-items:center; gap:8px; padding:9px 10px 9px 12px; border-bottom:1px solid var(--line); }
  .panel-title { font-weight:700; color:#334155; }
  .panel-timer { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; color:#0f172a; }
  .panel-timer.warn { color:#b91c1c; }
  .panel-toggle { border:none; background:transparent; padding:0 2px; font-size:14px; line-height:1; color:#64748b; }
  .panel-body { padding:10px 12px 12px; }
  .panel-stats { display:flex; justify-content:space-between; color:#475569; margin-bottom:7px; }
  .panel-stats b { color:#0f172a; }
  .panel-bar { height:6px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin-bottom:9px; }
  .panel-bar i { display:block; height:100%; width:0; background:#2563eb; border-radius:999px; transition:width .2s ease; }
  .panel-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; max-height:132px; overflow:auto; }
  .panel-grid button { padding:0; height:24px; font-size:11px; border-radius:6px; border:1px solid #e2e8f0; background:#fff; color:#64748b; }
  .panel-grid button.ans { background:#dbeafe; border-color:#bfdbfe; color:#1d4ed8; font-weight:700; }
  .panel-next { width:100%; margin-top:9px; padding:6px 8px; font-size:12px; }
  .panel.collapsed { width:auto; }
  .panel.collapsed .panel-body { display:none; }
  .panel.collapsed .panel-head { border-bottom:none; }
  .q.flash { outline:3px solid #93c5fd; outline-offset:3px; }
  .print-head { display:none; }
  @media (max-width:640px) { .panel { right:10px; bottom:10px; width:196px; } .panel-grid { grid-template-columns:repeat(5,1fr); } }
  @media print {
    @page { size:A4; margin:9mm 9mm 10mm; }
    body { background:#fff; font-size:10.5pt; line-height:1.32; }
    .bar, .student, .foot, .gate, .done, .panel, button, input { display:none !important; }
    .result.show { display:block !important; margin:0 0 3mm; padding:2mm 2.5mm; border:1px solid #111; border-radius:0; break-inside:avoid; }
    .result h2 { font-size:12pt; margin:0 0 1mm; }
    .result-score { font-size:17pt; }
    .result-meta { font-size:8.5pt; }
    .result-hint { display:none; }
    .opt.correct, .opt.wrong { outline:none; background:none; }
    .opt.correct { border:1px solid #111; }
    .opt.wrong { border:1px dashed #111; }
    .badge { font-size:7.5pt; line-height:1.2; padding:0 1mm; border:1px solid #111; color:#111; }
    .explain { display:block; font-size:8.5pt; border-top:1px dotted #999; margin-top:1mm; padding-top:1mm; }
    .explain summary { display:none; }
    .q.ok, .q.bad { border-left:none; }
    .q { break-inside:auto; page-break-inside:auto; }
    .wrap { max-width:none; padding:0; margin:0; }
    header.paper { border:none; border-radius:0; border-bottom:1px solid #111; padding:0 0 2.5mm; margin:0 0 1.5mm; }
    h1 { font-size:15pt; margin:0 0 .8mm; }
    .sub { font-size:9pt; margin-bottom:.8mm; }
    .meta { font-size:8.5pt; gap:8mm; }
    #instructions { font-size:9pt !important; margin:1mm 0 0 !important; }
    .print-head { display:block; font-size:9pt; margin-top:2mm; color:#111; }
    .q { break-inside:avoid; page-break-inside:avoid; border:0; border-radius:0; padding:1.6mm 0 1.2mm; margin:0; background:#fff; }
    .q + .q { border-top:1px dotted #cbd5e1; }
    .q h3 { display:inline; font-size:10.5pt; margin:0 1.5mm 0 0; }
    .q .stem { display:inline; }
    .opt { padding:.35mm 0; gap:2mm; }
    .opt:hover { background:none; }
    .opt .k { width:6mm; }
    a { color:inherit; text-decoration:none; }
  }
</style>
</head>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h3 style="margin:0">需要访问口令</h3>
    <p class="sub">请输入老师提供的口令</p>
    <input id="gateInput" type="password" autocomplete="off" />
    <div class="err" id="gateErr"></div>
    <button class="primary" id="gateBtn">进入试卷</button>
  </div>
</div>
<div class="wrap">
  <header class="paper">
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div class="meta">
      <span>题数 <b id="count"></b></span>
      <span id="limitWrap">限时 <b id="limit"></b></span>
    </div>
    <p id="instructions" style="margin:12px 0 0;color:#374151"></p>
    <div class="print-head">姓名：______________　学号：______________　日期：______________</div>
  </header>

  <div class="student">
    <input id="sName" placeholder="姓名" autocomplete="off" />
    <input id="sId" placeholder="学号 / 班级" autocomplete="off" />

  <div class="bar">

    <button id="btnSubmit" class="primary" hidden>提交并批改</button>
    <button id="btnPrint">打印 / PDF</button>
    <button id="btnImport">导入答案</button>
    <button id="btnExport" class="primary">导出答案</button>
    <button id="btnClear" class="ghost">清空</button>
    <input id="fileInput" type="file" accept="application/json" hidden />
  </div>

  <div class="done" id="done"></div>
  <div class="result" id="result" hidden></div>
  <div id="paper"></div>

  <aside class="panel" id="panel" aria-label="答题进度">
    <div class="panel-head">
      <span class="panel-title">答题进度</span>
      <span class="panel-timer" id="panelTimer">--:--</span>
      <button class="panel-toggle" id="panelToggle" title="收起 / 展开">▾</button>

    <div class="panel-body">

      <div class="panel-bar"><i id="panelProgress"></i></div>
      <div class="panel-grid" id="panelGrid"></div>
      <button class="panel-next" id="panelNext">跳到第一道未答</button>
    </div>
  </aside>
  <div class="foot">答案会自动保存在本机浏览器中；换设备时请先导出，再在新设备导入。</div>
</div>

_5 =$"},"options":{"A":"24","B":"30","C":"48","D":"54"}},{"id":"m3a-008","q":{"zh":"点 $(2, -1)$ 到直线 $4x - 3y + 4 = 0$ 的距离是","en":"The distance from $(2, -1)$ to the line $4x - 3y + 4 = 0$ is"},"options":{"A":"$\\frac{9}{5}$","B":"$\\frac{11}{5}$","C":"$3$","D":"$15$"}},{"id":"x16-048","q":{"zh":"使用平行线间距离公式 $d=\\dfrac{|C_1-C_2|}{\\sqrt{A^2+B^2}}$ 的前提是","en":"The parallel-line distance formula requires that"},"options":{"A":{"zh":"两直线方程中 $x,y$ 的系数分别相同","en":"the coefficients of x and y are identical in both equations"},"B":{"zh":"两直线都过原点","en":"both lines pass through the origin"},"C":{"zh":"两直线斜率都为 $1$","en":"both slopes equal 1"},"D":{"zh":"两直线互相垂直","en":"the lines are perpendicular"}}},{"id":"x17-038","q":{"zh":"圆心在直线 $y=2x$ 上，且经过 $O(0,0)$、$A(2,0)$ 两点的圆的标准方程是","en":"The center of a circle lies on the line $y=2x$, and the circle passes through $O(0,0)$ and $A(2,0)$. Its standard equation is"},"options":{"A":"$(x-2)^2+(y-1)^2=5$","B":"$(x-1)^2+(y-2)^2=5$","C":"$(x-1)^2+(y-2)^2=4$","D":"$(x+1)^2+(y+2)^2=5$"}},{"id":"x17-095","q":{"zh":"圆心为 $(3,-2)$、半径为 $5$ 的圆的标准方程是","en":"The standard equation of the circle with center $(3,-2)$ and radius $5$ is"},"options":{"A":"$(x-3)^2+(y+2)^2=25$","B":"$(x+3)^2+(y-2)^2=25$","C":"$(x-3)^2+(y+2)^2=5$","D":"$(x-3)^2+(y-2)^2=25$"}},{"id":"m3-177","q":{"zh":"椭圆 $\\frac{x^2}{16} + \\frac{y^2}{9} = 1$ 的长轴端点坐标是","en":"The endpoints of the major axis of $x^2/16 + y^2/9 = 1$ are"},"options":{"A":"$(\\pm 4, 0)$","B":"$(0, \\pm 4)$","C":"$(\\pm 3, 0)$","D":"$(\\pm 5, 0)$"}},{"id":"x19-041","q":{"zh":"双曲线 $\\frac{y^2}{25}-\\frac{x^2}{16}=1$ 的虚轴端点坐标是","en":"The endpoints of the conjugate axis of the hyperbola $\\frac{y^2}{25}-\\frac{x^2}{16}=1$ are"},"options":{"A":"$(0,\\pm5)$","B":"$(\\pm5,0)$","C":"$(\\pm4,0)$","D":"$(0,\\pm4)$"}},{"id":"m3-089","q":{"zh":"抛物线 $x^2 = -8y$ 的准线方程是","en":"The directrix of $x^2 = -8y$ is"},"options":{"A":"$y = -2$","B":"$y = 4$","C":"$y = 2$","D":"$y = -4$"}},{"id":"x21-004","q":{"zh":"在平行四边形 $ABCD$ 中，与向量 $\\overrightarrow{AB}$ 相等的向量是","en":"In parallelogram $ABCD$, which vector equals $\\overrightarrow{AB}$?"},"options":{"A":"$\\overrightarrow{BA}$","B":"$\\overrightarrow{CD}$","C":"$\\overrightarrow{AD}$","D":"$\\overrightarrow{DC}$"}},{"id":"m3b-019","q":{"zh":"单位向量 $\\vec{e_1}$，$\\vec{e_2}$ 的夹角为 $60^\\circ$，则 $(\\vec{e_1} + \\vec{e_2}) \\cdot \\vec{e_1} =$","en":"Unit vectors $\\vec{e_1}$, $\\vec{e_2}$ form a $60^\\circ$ angle. Then $(\\vec{e_1} + \\vec{e_2}) \\cdot \\vec{e_1} =$"},"options":{"A":"$\\frac{1}{2}$","B":"1","C":"$\\frac{3}{2}$","D":"2"}},{"id":"m3b-026","q":{"zh":"$(3 - 2i) + (-1 + 5i) =$","en":"$(3 - 2i) + (-1 + 5i) =$"},"options":{"A":"$2 + 3i$","B":"$4 + 3i$","C":"$2 - 3i$","D":"$4 - 7i$"}},{"id":"m4s-017","q":{"zh":"在边长为 $2$ 的正方形内随机取一点，该点到正方形中心的距离小于 $1$ 的概率是","en":"A point is chosen at random inside a square of side $2$. The probability that its distance to the center is less than $1$ is"},"options":{"A":"$\\frac{\\pi}{4}$","B":"$\\frac{\\pi}{2}$","C":"$\\frac{1}{2}$","D":"$\\frac{1}{4}$"}},{"id":"m4-212","q":{"zh":"$z$ 分数的计算公式是","en":"The z-score formula is"},"options":{"A":"$z = \\frac{x + \\mu}{\\sigma}$","B":"$z = \\frac{x - \\mu}{\\sigma}$","C":"$z = \\frac{\\mu - x}{\\sigma}$","D":"$z = x \\cdot \\sigma + \\mu$"}}]};
  var KEY = 'csca-exam-' + DATA.slug;
  var state = { answers: {}, name: '', sid: '', startedAt: Date.now(), submittedAt: 0, locked: false, lang: 'zh' };
  var saveTimer = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        state = Object.assign(state, s);
      }
    } catch (e) {}
    if (!state.startedAt) state.startedAt = Date.now();
  }
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 150);
  }
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function txt(v) { return typeof v === 'string' ? v : (v[state.lang] || v.zh || v.en || ''); }
  function renderMath(root) {
    if (window.renderMathInElement) {
      window.renderMathInElement(root, { delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ], throwOnError: false });
    }
  }

  function render() {
    document.getElementById('title').textContent = DATA.title;
    document.getElementById('subtitle').textContent = DATA.subtitle || '';
    document.getElementById('instructions').textContent = DATA.instructions || '';
    document.getElementById('count').textContent = String(DATA.questions.length);
    if (DATA.durationMinutes) {
      document.getElementById('limit').textContent = DATA.durationMinutes + ' 分钟';
    } else {
      document.getElementById('limitWrap').style.display = 'none';
    }

    var graded = Boolean(DATA.showResults && state.locked && state.submittedAt);
    var host = document.getElementById('paper');
    host.innerHTML = '';
    DATA.questions.forEach(function (q, i) {
      var chosen = state.answers[q.id] || null;
      var box = document.createElement('section');
      box.className = 'q' + (graded ? (chosen === q.correct ? ' ok' : ' bad') : '');
      box.setAttribute('data-index', String(i));
      var h = document.createElement('h3');
      h.textContent = (i + 1) + '.';
      box.appendChild(h);
      var stem = document.createElement('div');
      stem.className = 'stem';
      stem.textContent = txt(q.q);
      box.appendChild(stem);
      ['A', 'B', 'C', 'D'].forEach(function (K) {
        if (!q.options[K]) return;
        var row = document.createElement('div');
        var cls = 'opt' + (chosen === K ? ' on' : '');
        if (graded && K === q.correct) cls += ' correct';
        else if (graded && chosen === K) cls += ' wrong';
        row.className = cls;
        row.setAttribute('data-q', q.id);
        row.setAttribute('data-k', K);
        var k = document.createElement('span'); k.className = 'k'; k.textContent = K + '.';
        var v = document.createElement('span'); v.textContent = txt(q.options[K]);
        row.appendChild(k); row.appendChild(v);
        if (graded && K === q.correct) {
          var okBadge = document.createElement('span');
          okBadge.className = 'badge ok';
          okBadge.textContent = '正确答案';
          row.appendChild(okBadge);
        }
        if (graded && chosen === K) {
          var pick = document.createElement('span');
          pick.className = 'badge ' + (K === q.correct ? 'ok' : 'bad');
          pick.textContent = K === q.correct ? '你的选择 ✓' : '你的选择 ✗';
          row.appendChild(pick);
        }
        row.addEventListener('click', function () {
          if (state.locked) return;
          state.answers[q.id] = (state.answers[q.id] === K ? null : K);
          persist();
          render();
        });
        box.appendChild(row);
      });
      if (graded && q.explanation) {
        var det = document.createElement('details');
        det.className = 'explain';
        det.open = true;
        var sum = document.createElement('summary');
        sum.textContent = '解析';
        var body = document.createElement('div');
        body.textContent = txt(q.explanation);
        det.appendChild(sum); det.appendChild(body);
        box.appendChild(det);
      }
      host.appendChild(box);
    });
    renderMath(host);
    document.getElementById('sName').value = state.name || '';
    document.getElementById('sId').value = state.sid || '';
    document.getElementById('btnSubmit').hidden = !DATA.showResults || graded;
    renderResult(graded);
    renderPanel();
  }

  function buildPanelGrid() {
    var grid = document.getElementById('panelGrid');
    if (grid.childElementCount === DATA.questions.length) return;
    grid.innerHTML = '';
    DATA.questions.forEach(function (q, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(i + 1);
      b.addEventListener('click', function () { jumpToQuestion(i); });
      grid.appendChild(b);
    });
  }
  function jumpToQuestion(i) {
    var el = document.querySelector('.q[data-index="' + i + '"]');
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    setTimeout(function () { el.classList.remove('flash'); }, 1200);
  }
  function renderPanel() {
    var total = DATA.questions.length;
    var done = 0;
    DATA.questions.forEach(function (q) { if (state.answers[q.id]) done += 1; });
    document.getElementById('doneCount').textContent = String(done);
    document.getElementById('todoCount').textContent = String(total - done);
    document.getElementById('panelProgress').style.width = (total ? Math.round((done / total) * 100) : 0) + '%';
    buildPanelGrid();
    var grid = document.getElementById('panelGrid');
    for (var i = 0; i < grid.children.length; i += 1) {
      grid.children[i].className = state.answers[DATA.questions[i].id] ? 'ans' : '';
    }
    document.getElementById('panelNext').disabled = done >= total;
  }

  function fmtDuration(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m <= 0) return s + ' 秒';
    return m + ' 分 ' + (s < 10 ? '0' : '') + s + ' 秒';
  }

  function renderResult(graded) {
    var el = document.getElementById('result');
    if (!graded) {
      el.hidden = true;
      el.className = 'result';
      el.innerHTML = '';
      return;
    }
    var total = DATA.questions.length;
    var correct = 0, unanswered = 0;
    DATA.questions.forEach(function (q) {
      var chosen = state.answers[q.id] || null;
      if (!chosen) unanswered += 1;
      if (chosen && chosen === q.correct) correct += 1;
    });
    var pct = total ? Math.round((correct / total) * 100) : 0;
    var seconds = (state.submittedAt - state.startedAt) / 1000;
    el.innerHTML = '';
    el.hidden = false;
    el.className = 'result show';

    var h = document.createElement('h2');
    h.textContent = '批改结果';
    el.appendChild(h);

    var score = document.createElement('div');
    score.className = 'result-score';
    score.appendChild(document.createTextNode(correct + ' / ' + total + ' '));
    var small = document.createElement('small');
    small.textContent = '题正确';
    score.appendChild(small);
    el.appendChild(score);

    var meta = document.createElement('div');
    meta.className = 'result-meta';
    meta.textContent = '正确率 ' + pct + '% · 用时 ' + fmtDuration(seconds) + ' · 未作答 ' + unanswered + ' 题';
    el.appendChild(meta);

    var who = document.createElement('div');
    who.className = 'result-meta';
    who.textContent = (state.name || '未填写姓名') + (state.sid ? '（' + state.sid + '）' : '') +
      ' · 提交于 ' + new Date(state.submittedAt).toLocaleString();
    el.appendChild(who);

    var hint = document.createElement('div');
    hint.className = 'result-hint';
    hint.textContent = '需要纸质版时，点击“打印 / PDF”，批改结果和解析会一起打印。';
    el.appendChild(hint);
  }

  function submitPaper() {
    if (!DATA.showResults || state.locked) return;
    var unanswered = 0;
    DATA.questions.forEach(function (q) { if (!state.answers[q.id]) unanswered += 1; });
    if (unanswered > 0 && !confirm('还有 ' + unanswered + ' 题未作答，确定提交吗？提交后不能修改答案。')) return;
    state.locked = true;
    state.submittedAt = Date.now();
    persist();
    render();
    var el = document.getElementById('result');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function tick() {
    var panelTimer = document.getElementById('panelTimer');
    if (state.locked && state.submittedAt) {
      var stopped = fmt((state.submittedAt - state.startedAt) / 1000);
      document.getElementById('timer').textContent = stopped;
      panelTimer.textContent = stopped;
      return;
    }
    if (!DATA.durationMinutes) {
      var used = fmt((Date.now() - state.startedAt) / 1000);
      document.getElementById('timer').textContent = used;
      panelTimer.textContent = used;
      return;
    }
    var left = DATA.durationMinutes * 60 - (Date.now() - state.startedAt) / 1000;
    var el = document.getElementById('timer');
    el.textContent = fmt(left);
    panelTimer.textContent = fmt(left);
    var warn = left <= 300;
    if (warn) el.classList.add('warn');
    panelTimer.classList.toggle('warn', warn);
    if (left <= 0 && !state.locked) {
      state.locked = true; state.submittedAt = Date.now(); persist();
      if (DATA.showResults) {
        render();
        var result = document.getElementById('result');
        if (result) result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        var done = document.getElementById('done');
        done.style.display = 'block';
        done.textContent = '时间到，答案已锁定。请点击“导出答案”交给老师。';
      }
    }
  }

  document.getElementById('sName').addEventListener('input', function (e) { state.name = e.target.value; persist(); });
  document.getElementById('sId').addEventListener('input', function (e) { state.sid = e.target.value; persist(); });

  document.getElementById('btnClear').addEventListener('click', function () {
    if (!confirm(state.locked ? '重新作答会清除本次批改结果，确定继续？' : '确定清空所有已选答案？')) return;
    state.answers = {}; state.locked = false; state.submittedAt = 0;
    document.getElementById('done').style.display = 'none';
    persist(); render();
  });

  document.getElementById('panelToggle').addEventListener('click', function () {
    var panel = document.getElementById('panel');
    panel.classList.toggle('collapsed');
    this.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
  });
  document.getElementById('panelNext').addEventListener('click', function () {
    for (var i = 0; i < DATA.questions.length; i += 1) {
      if (!state.answers[DATA.questions[i].id]) { jumpToQuestion(i); return; }
    }
  });

  document.getElementById('btnSubmit').addEventListener('click', submitPaper);
  document.getElementById('btnPrint').addEventListener('click', function () { window.print(); });

  document.getElementById('btnExport').addEventListener('click', function () {
    var out = {
      paperId: DATA.paperId,
      slug: DATA.slug,
      student: { name: state.name || '', id: state.sid || '' },
      answers: DATA.questions.map(function (q) { return { problemId: q.id, selected: state.answers[q.id] || null }; }),
      startedAt: state.startedAt,
      submittedAt: state.submittedAt || Date.now(),
      durationSeconds: Math.round(((state.submittedAt || Date.now()) - state.startedAt) / 1000)
    };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'answers-' + DATA.slug + '-' + (state.name || 'student') + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById('btnImport').addEventListener('click', function () { document.getElementById('fileInput').click(); });
  document.getElementById('fileInput').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        if (state.locked) { alert('本卷已提交，不能导入答案。如需重做请先点“清空”。'); e.target.value = ''; return; }
        var obj = JSON.parse(String(reader.result));
        if (obj.paperId && obj.paperId !== DATA.paperId) {
          if (!confirm('这份答案属于另一份试卷，仍要导入吗？')) return;
        }
        var map = {};
        (obj.answers || []).forEach(function (a) { if (a.selected) map[a.problemId] = a.selected; });
        state.answers = map;
        if (obj.student) { state.name = obj.student.name || state.name; state.sid = obj.student.id || state.sid; }
        persist(); render();
      } catch (err) { alert('文件格式不正确'); }
    };
    reader.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('btnLang').addEventListener('click', function () {
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    document.getElementById('btnLang').textContent = state.lang === 'zh' ? 'EN' : '中文';
    persist(); render();
  });

  function boot() {
    load();
    document.getElementById('btnLang').textContent = state.lang === 'zh' ? 'EN' : '中文';
    if (DATA.passcode) {
      var gate = document.getElementById('gate');
      gate.hidden = false;
      document.getElementById('gateBtn').addEventListener('click', function () {
        if (document.getElementById('gateInput').value === DATA.passcode) {
          gate.hidden = true;
        } else {
          document.getElementById('gateErr').textContent = '口令不正确';
        }
      });
    }
    render();
    tick();
    setInterval(tick, 1000);
  }
  boot();
})();
</script>
</body>
</html>
